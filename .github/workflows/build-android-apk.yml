name: Android Build (manual)

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK (if Android project exists)
        working-directory: ./android
        run: |
          if [ -f ./gradlew ]; then
            echo "Found Gradle wrapper, building APK..."
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          else
            echo "No Android Gradle wrapper found at ./android/gradlew — skipping build step."
          fi
