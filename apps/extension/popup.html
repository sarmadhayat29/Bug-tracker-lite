<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bug Tracker Lite Extension</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">Bug Tracker Lite</div>
    <div id="auth-state" class="auth-state">
      <!-- "Logout" button injected here when logged in -->
    </div>
  </header>

  <main class="content">
    <!-- View 1: Login Form -->
    <div id="view-login" class="view hidden">
      <h2 class="view-title">Sign In</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="intern@bugtracker.test" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit">Login</button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>
    </div>

    <!-- View 2: Report Bug Form -->
    <div id="view-report" class="view hidden">
      <form id="report-form">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="bug-title" required placeholder="What went wrong?" />
        </div>
        
        <div class="form-group">
          <label>Severity</label>
          <select id="bug-severity">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>

        <div class="form-group">
          <label>Screenshot Annotation (Optional)</label>
          <div class="canvas-container">
            <div id="canvas-loading" class="canvas-placeholder">Capturing tab...</div>
            <canvas id="annotation-canvas" class="hidden"></canvas>
          </div>
          <p class="help-text">Click and drag to draw in red.</p>
        </div>

        <button type="submit" class="btn btn-primary" id="report-submit">Submit Bug</button>
        <p id="report-error" class="error-msg hidden"></p>
        <p id="report-success" class="success-msg hidden">Bug reported successfully!</p>
      </form>
    </div>

    <!-- View 3: Loading -->
    <div id="view-loading" class="view loading-view">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Output bundled script -->
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
